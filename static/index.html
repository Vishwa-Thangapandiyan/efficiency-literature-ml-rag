<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg:         #0a0e1a;
      --text:       #c9d1d9;
      --text-muted: #4d5566;
      --accent:     #4f8ef7;
      --border:     #1c2233;
      --input-bg:   #111827;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ── Background Canvas ─────────────────────────────── */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Layout ────────────────────────────────────────── */
    #shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ── Header ────────────────────────────────────────── */
    #hdr {
      flex-shrink: 0;
      padding: 22px 0 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    #hdr h1 {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    #corpus-tag {
      font-size: 0.72rem;
      color: #2a3550;
      background: #131c2e;
      border: 1px solid #1c2b45;
      border-radius: 4px;
      padding: 1px 7px;
      letter-spacing: 0.04em;
    }

    /* ── Answer Section ────────────────────────────────── */
    #answer-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 16px;
      scrollbar-width: thin;
      scrollbar-color: #1c2233 transparent;
    }

    /* status bar */
    #status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 22px;
      margin-bottom: 18px;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-style: italic;
      transition: opacity 0.3s;
    }

    #status.hidden { opacity: 0; }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: breathe 1.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50%       { opacity: 1;   transform: scale(1.15); }
    }

    /* answer content */
    #answer {
      color: var(--text);
      line-height: 1.78;
    }

    #answer.empty {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* markdown typography */
    #answer h1, #answer h2, #answer h3 {
      color: #dde4f0;
      font-weight: 600;
      line-height: 1.3;
      margin: 1.6em 0 0.5em;
    }
    #answer h1:first-child,
    #answer h2:first-child,
    #answer h3:first-child { margin-top: 0; }
    #answer h1 { font-size: 1.2rem; }
    #answer h2 { font-size: 1.05rem; }
    #answer h3 { font-size: 0.97rem; color: #a8b4cc; }

    #answer p { margin: 0.6em 0; }
    #answer p:first-child { margin-top: 0; }

    #answer ul, #answer ol { padding-left: 1.4em; margin: 0.5em 0; }
    #answer li { margin: 0.25em 0; }
    #answer li > ul, #answer li > ol { margin: 0.15em 0; }

    #answer strong { color: #dde4f0; }
    #answer em     { color: #7a8899; }

    #answer a { color: var(--accent); text-decoration: none; }
    #answer a:hover { text-decoration: underline; }

    #answer code {
      background: rgba(79, 142, 247, 0.08);
      border: 1px solid rgba(79, 142, 247, 0.18);
      border-radius: 3px;
      padding: 0.08em 0.38em;
      font-size: 0.86em;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: #7db4f7;
    }

    #answer pre {
      background: #0e1320;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    #answer pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.875rem;
      color: #a8b8d0;
    }

    #answer blockquote {
      border-left: 2px solid #2a3a5c;
      margin: 0.8em 0;
      padding: 0.2em 1em;
      color: #6b7a94;
    }

    #answer hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5em 0;
    }

    /* ── Input Section ─────────────────────────────────── */
    #input-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 14px 0 20px;
    }

    #input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    #q {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.93rem;
      font-family: inherit;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    #q::placeholder { color: #323d52; }

    #q:focus {
      border-color: #2a4a7a;
      box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.08);
    }

    #q:disabled { opacity: 0.45; }

    #btn {
      background: var(--accent);
      color: #05090f;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.18s, transform 0.1s;
    }

    #btn:hover:not(:disabled) { opacity: 0.88; }
    #btn:active:not(:disabled) { transform: scale(0.97); }
    #btn:disabled { opacity: 0.35; cursor: not-allowed; }

    #hint {
      margin-top: 7px;
      font-size: 0.72rem;
      color: #2a3550;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div id="shell">
    <div id="hdr">
      <h1>Research Assistant</h1>
      <span id="corpus-tag">ML compression corpus</span>
    </div>

    <div id="answer-wrap">
      <div id="status" class="hidden">
        <span class="dot"></span>
        <span id="status-text"></span>
      </div>
      <div id="answer" class="empty">
        Ask a question about the research corpus to get started.
      </div>
    </div>

    <div id="input-wrap">
      <div id="input-row">
        <input id="q" type="text"
          placeholder="How does knowledge distillation work?"
          autocomplete="off" spellcheck="false" />
        <button id="btn">Ask</button>
      </div>
      <div id="hint">Enter to submit &nbsp;·&nbsp; answers replace on each query</div>
    </div>
  </div>

<script>
/* ── Canvas background: interference wave grid ──────────── */
(function () {
  const cv = document.getElementById('bg');
  const cx = cv.getContext('2d');
  let t = 0;

  function resize() {
    cv.width  = window.innerWidth;
    cv.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const GAP = 38; // grid spacing

  function frame() {
    cx.clearRect(0, 0, cv.width, cv.height);

    const cols = Math.ceil(cv.width  / GAP) + 2;
    const rows = Math.ceil(cv.height / GAP) + 2;

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        // two-wave interference → organic breathing pattern
        const w1 = Math.sin(i * 0.45 + t);
        const w2 = Math.cos(j * 0.45 + t * 0.65 + 1.1);
        const amp = (w1 * w2 + 1) * 0.5; // 0→1

        const alpha  = amp * 0.095;
        const radius = 0.7 + amp * 1.6;

        cx.beginPath();
        cx.arc(i * GAP, j * GAP, radius, 0, 6.2832);
        cx.fillStyle = `rgba(79,142,247,${alpha.toFixed(3)})`;
        cx.fill();
      }
    }

    t += 0.0035;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── Query logic ─────────────────────────────────────────── */
const qEl     = document.getElementById('q');
const btnEl   = document.getElementById('btn');
const ansEl   = document.getElementById('answer');
const statusEl = document.getElementById('status');
const stxtEl  = document.getElementById('status-text');

function setStatus(msg) {
  if (msg) {
    stxtEl.textContent = msg;
    statusEl.classList.remove('hidden');
  } else {
    statusEl.classList.add('hidden');
    stxtEl.textContent = '';
  }
}

function setBusy(busy) {
  qEl.disabled  = busy;
  btnEl.disabled = busy;
}

async function ask() {
  const query = qEl.value.trim();
  if (!query) return;

  setBusy(true);
  setStatus('Initializing…');
  ansEl.classList.remove('empty');
  ansEl.innerHTML = '';

  let fullText = '';
  let sseBuffer = '';

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });

    if (!res.ok) throw new Error(`Server error ${res.status}`);

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      sseBuffer += decoder.decode(value, { stream: true });

      // SSE lines end in \n; split and keep partial last line
      const lines = sseBuffer.split('\n');
      sseBuffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;

        let evt;
        try { evt = JSON.parse(raw); } catch { continue; }

        if (evt.type === 'status') {
          setStatus(evt.message);

        } else if (evt.type === 'token') {
          fullText += evt.text;
          // render markdown incrementally; scroll to bottom
          ansEl.innerHTML = marked.parse(fullText);
          const wrap = document.getElementById('answer-wrap');
          wrap.scrollTop = wrap.scrollHeight;

        } else if (evt.type === 'done') {
          setStatus('');

        } else if (evt.type === 'error') {
          throw new Error(evt.message || 'Unknown error from server');
        }
      }
    }

    // render final pass cleanly in case the last chunk was partial
    if (fullText) ansEl.innerHTML = marked.parse(fullText);

  } catch (err) {
    setStatus('');
    ansEl.innerHTML =
      `<p style="color:#e05c5c;font-size:0.88rem;">⚠ ${err.message}</p>`;
  } finally {
    setBusy(false);
  }
}

btnEl.addEventListener('click', ask);
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
